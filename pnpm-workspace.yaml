packages:
  - .
  - client
  - packages/crisp-sdk
  - packages/crisp-contracts
  - packages/crisp-zk-inputs
linkWorkspacePackages: true
# Keep in sync with "pnpm.overrides" in package.json; pnpm versions differ in which one they read.
overrides:
  # @interfold/contracts declares ^5.0.2 but imports utils/ReentrancyGuardUpgradeable.sol, which
  # contracts-upgradeable removed after 5.0. Interfold builds against 5.0.2.
  '@interfold/contracts>@openzeppelin/contracts-upgradeable': 5.0.2
  # The interfold workspace pins.
  '@nomicfoundation/hardhat-keystore': 3.0.3
  '@types/node': 22.7.5
  tsup: 8.5.0
  typescript: 5.8.3
  undici-types: 6.19.8
  viem: 2.38.6
