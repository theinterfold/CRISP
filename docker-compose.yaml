services:
  interfold-dev:
    platform: linux/amd64
    build:
      context: .
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-100}
        USERNAME: ubuntu
    volumes:
      - .:/app
      - git-folder:/app/.git
      - cargo-bin:/home/ubuntu/.cargo/bin
      - cargo-registry:/home/ubuntu/.cargo/registry
      - cargo-target:/app/target
      - interfold-target:/app/interfold/target
      - interfold-node-modules:/app/interfold/node_modules
      - evm-node-modules:/app/interfold/packages/interfold-contracts/node_modules
      - crisp-node-modules:/app/node_modules
      - client-node-modules:/app/client/node_modules
      - crisp-contracts-node-modules:/app/packages/crisp-contracts/node_modules
      - crisp-foundry-cache:/app/packages/crisp-contracts/out
      - synpress-cache:/app/.cache-synpress
      - test-results:/app/test-results
      - playwright-report:/app/playwright-report
    entrypoint:
      - ''
    ports:
      - '8545:8545'
      - '3000:3000'
      - '4000:4000'
    command: >
      /bin/bash -c ' sudo chown -R ubuntu:ubuntu /app && sudo chown -R ubuntu:ubuntu /home/ubuntu && sudo chmod -R 777 /app
      && tail -f /dev/null '

volumes:
  cargo-bin:
  cargo-registry:
  cargo-target:
  interfold-target:
  interfold-node-modules:
  evm-node-modules:
  crisp-node-modules:
  client-node-modules:
  crisp-contracts-node-modules:
  crisp-foundry-cache:
  git-folder:
  synpress-cache:
  test-results:
  playwright-report:
