name: Install Node dependencies
description: Install pnpm and Node.js, then the dependencies of the interfold submodule and of CRISP

inputs:
  node-version:
    description: Node.js version
    required: true
  compile-interfold-contracts:
    description: Compile the interfold contracts in the submodule, which writes the dist directory that CRISP's `@interfold/contracts` link points at
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
        cache-dependency-path: |
          pnpm-lock.yaml
          interfold/pnpm-lock.yaml

    # CRISP's root package.json links `@interfold/contracts` and `@interfold/config` to packages in
    # the submodule, so the submodule installs first.
    - name: Install interfold dependencies
      shell: bash
      working-directory: interfold
      run: pnpm install --frozen-lockfile

    # `hardhat.config.ts` imports `@interfold/contracts/tasks/*`, which resolves only after
    # `evm:build` writes `dist/`.
    - name: Compile interfold contracts
      if: inputs.compile-interfold-contracts == 'true'
      shell: bash
      working-directory: interfold
      run: pnpm evm:build

    - name: Install CRISP dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
